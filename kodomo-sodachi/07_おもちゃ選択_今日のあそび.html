*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);

header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);}

main{padding:14px 14px 60px;max-width:760px;margin:0 auto}

h1{font-size:1.05rem;font-weight:700;margin:1em 0 .5em}
.lead{color:var(--sub);font-size:.86rem;margin:.6em 0 1.1em}

/* ---- 選択グリッド ---- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
@media (max-width:380px){.grid{grid-template-columns:repeat(2,1fr)}}
.toy{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 6px 10px;
  text-align:center;cursor:pointer;color:var(--ink);font-family:inherit;transition:border-color .15s, transform .1s}

.toy .ic{font-size:1.7rem;display:block;line-height:1.2;margin-bottom:4px}
.toy .lb{font-size:.74rem;font-weight:600;display:block}
.toy .tag{display:block;font-size:.6rem;color:var(--sub);margin-top:2px}
.toy.active{border-color:var(--accent);border-width:2px;background:var(--l1bg)}
.toy.state{border-style:dashed}

/* ---- 詳細パネル ---- */
#detail{display:none;margin-top:18px}
#detail.show{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;margin-bottom:14px}
.dhead{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.dhead .ic{font-size:2rem;line-height:1}
.dhead h2{margin:0;font-size:1.15rem;line-height:1.3}
.dhead .tag{font-size:.68rem;color:var(--sub);font-weight:600}
.catch{color:var(--sub);font-size:.86rem;margin:.5em 0 0}

.sec{margin-top:1.3em}
.sec h3{font-size:.9rem;margin:0 0 .5em;color:var(--accent);display:flex;align-items:center;gap:.4em}
.sec ul{margin:0;padding-left:1.2em}
.sec li{font-size:.88rem;margin:.3em 0}

.timeline{display:flex;gap:6px;align-items:stretch;margin-top:.4em}
.tl-step{flex:1;min-width:0;border-radius:10px;padding:8px 8px;font-size:.72rem;line-height:1.5}
.tl-step.prev,.tl-step.next{background:var(--bg);border:1px dashed var(--line);color:var(--sub)}
.tl-step.now{background:var(--l1bg);border:2px solid var(--l1);color:var(--ink);font-weight:600}
.tl-age{display:block;font-size:.66rem;font-weight:700;margin-bottom:3px;color:var(--accent)}
.tl-step.now .tl-age{color:var(--l1)}
.tl-arrow{align-self:center;color:var(--sub);font-size:.9rem;flex:0 0 auto}
@media (max-width:420px){
  .timeline{flex-direction:column}
  .tl-arrow{align-self:flex-start;padding-left:6px;transform:rotate(90deg);margin:-4px 0}
}

.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:.3em}
.badge{font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.badge.l2{background:var(--l2bg);color:var(--l2)}
.badge.l3{background:var(--l3bg);color:var(--l3)}

.watch{background:var(--warnbg);border-left:4px solid var(--warn);border-radius:8px;padding:.7em .9em}
.watch li{color:var(--ink)}
.sign{background:var(--l1bg);border-left:4px solid var(--l1);border-radius:8px;padding:.7em .9em}

.src{font-size:.74rem;color:var(--sub);margin-top:1em;padding-top:.7em;border-top:1px dashed var(--line)}

.reassure{margin-top:6px;font-size:.82rem;color:var(--sub);text-align:center;padding:10px 6px}
.hint{font-size:.82rem;color:var(--sub);text-align:center;padding:8px 0 2px}
</style>

const grid = document.getElementById("grid");
const detail = document.getElementById("detail");
const hint = document.getElementById("hint");

ITEMS.forEach(item=>{
  const btn = document.createElement("button");
  btn.className = "toy" + (item.tag === "今のようす" ? " state" : "");
  btn.dataset.id = item.id;
  btn.innerHTML = `<span class="ic">${item.icon}</span><span class="lb">${item.label.replace("\n","<br/>")}</span><span class="tag">${item.tag}</span>`;
  btn.addEventListener("click", ()=>select(item.id));
  grid.appendChild(btn);
});

function badge(text, cls){ return `<span class="badge ${cls}">${text}</span>`; }

function select(id){
  const item = ITEMS.find(i=>i.id===id);
  if(!item) return;
  document.querySelectorAll(".toy").forEach(b=>b.classList.toggle("active", b.dataset.id===id));
  hint.style.display = "none";

  detail.innerHTML = `
    <div class="dcard">
      <div class="dhead"><span class="ic">${item.icon}</span><div><h2>${item.label.replace("\n","")}</h2><span class="tag">${item.tag}</span></div></div>
      <p class="catch">${item.catch}</p>

      <div class="sec"><h3>🎯 今日はこれをやる（1〜3分でOK）</h3>
        <ul>${item.today.map(t=>`<li>${t}</li>`).join("")}</ul>
      </div>

      ${item.fun ? `<div class="sec"><h3>😄 うけるコツ（笑顔になりやすいやり方）</h3>
        <ul>${item.fun.map(t=>`<li>${t}</li>`).join("")}</ul>
        <p style="font-size:.78rem;color:var(--sub);margin-top:.6em">個人差が大きいところ。反応が薄ければ無理せず、いくつか試して合うものを見つければOK。（月齢ごとに何が「うける」か知りたいときは <a href="育ちマップ.html#tab-09" style="color:var(--accent)">喜び笑いタイムライン →</a>）</p>
      </div>` : ""}

      ${item.funAlt ? `<div class="sec"><h3>🔄 あんまり喜ばない時は</h3>
        <ul>${item.funAlt.map(t=>`<li>${t}</li>`).join("")}</ul>
      </div>` : ""}

      <div class="sec"><h3>🧭 発達の流れ（前の段階 → 今 → 次の段階）</h3>
        <div class="timeline">
          <div class="tl-step prev"><span class="tl-age">${item.prevAge}</span>${item.prev}</div>
          <div class="tl-arrow">→</div>
          <div class="tl-step now"><span class="tl-age">今・11〜12ヶ月</span>${item.catch}</div>
          <div class="tl-arrow">→</div>
          <div class="tl-step next"><span class="tl-age">${item.nextAge}</span>${item.next}</div>
        </div>
      </div>

      <div class="sec"><h3>🌱 育つ力</h3>
        <div class="badges">${item.l2.map(t=>badge(t,"l2")).join("")}</div>
      </div>

      <div class="sec"><h3>🔭 つながる未来</h3>
        <div class="badges">${item.l3.map(t=>badge(t,"l3")).join("")}</div>
      </div>

      <div class="sec"><h3>⚠️ 意識すべきポイント</h3>
        <ul class="watch">${item.watch.map(t=>`<li>${t}</li>`).join("")}</ul>
      </div>

      <div class="sec"><h3>✅ できたらいいサイン（11〜12ヶ月の目安）</h3>
        <p class="sign">${item.sign}</p>
      </div>

      <div class="src">出典：${item.src}</div>

}
